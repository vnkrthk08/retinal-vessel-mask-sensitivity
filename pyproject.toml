[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "retina-mask-sensitivity"
version = "0.1.0"
description = "Reproducible analysis of retinal vessel mask sensitivity"
requires-python = ">=3.11"
dependencies = [
  "numpy>=2.0,<3",
  "pandas>=2.2,<3",
  "matplotlib>=3.8,<4",
  "Pillow>=10.0",
  "scipy>=1.13,<2",
  "scikit-image>=0.24,<0.27",
  "truststore>=0.10.5,<1",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
